name: Evaluation regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.9
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run black --check graybench tests
      - run: uv run ruff check graybench tests --select E9,F63,F7,F82
